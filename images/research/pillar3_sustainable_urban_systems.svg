<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" width="100%" height="100%" style="background:#ffffff; border-radius:10px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <filter id="box-shadow3" x="-5%" y="-5%" width="110%" height="110%">
