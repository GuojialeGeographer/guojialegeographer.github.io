<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" width="100%" height="100%" style="background:#ffffff; border-radius:10px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="350" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Top Banner -->
  <rect x="0" y="0" width="1080" height="42" rx="10" fill="#f8fafc" />
  <rect x="0" y="32" width="1080" height="10" fill="#f8fafc" />
  <line x1="0" y1="42" x2="1080" y2="42" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#2563eb" />
  <text x="36" y="25" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.3">RESEARCH PILLAR 1: SPATIOTEMPORAL BIG DATA &amp; GEOSPATIAL FOUNDATION MODELS</text>
  <rect x="840" y="10" width="220" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="950" y="25" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">GeoAI • Multimodal LLMs • Mobility</text>

