    <rect width="245" height="34" rx="8" fill="#f5f3ff" />
    <rect y="26" width="245" height="8" fill="#f5f3ff" />
    <line x1="0" y1="34" x2="245" y2="34" stroke="#ddd6fe" stroke-width="1" />
